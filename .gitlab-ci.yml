# Use the official Python image
image: python:3.9

stages:
    - build
    - test
    - deploy

build:
    stage: build
    script:
        - echo "This is the build stage"
        - echo "$CI_JOB_ID"
        - echo "$CI_JOB_NAME"

test:
    stage: test
    script:
        - echo "this is the test stage"
        - python3 test.py

deploy:
    stage: deploy
    script:
        - echo "This is the deploy stage"
        - echo "Deploying code to staging environmnet"
